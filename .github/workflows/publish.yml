name: publish
# Publishes to PyPI when a GitHub release is published. Uses PyPI trusted publishing
# (OIDC), so no API token is stored in this repo.
#
# One-time setup on pypi.org (account owner only):
#   Account settings > Publishing > Add a pending publisher
#   PyPI project name: tokenreel | Owner: sunilgentyala | Repository: tokenreel
#   Workflow name: publish.yml | Environment name: pypi
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
