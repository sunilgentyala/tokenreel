name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
  dependency-review:
    # needs the dependency graph + GHAS, which private free repos lack; runs once public
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tokenreel-mcp .
      - run: docker run --rm --entrypoint python tokenreel-mcp -c "import tokenreel.mcp_server as m; print('ok', m.mcp.name)"
  docker-narrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg EXTRAS=mcp,tts,align -t tokenreel-narrate .
      - run: docker run --rm --entrypoint python tokenreel-narrate -c "import kokoro_onnx, faster_whisper, tokenreel.mcp_server; print('ok')"
