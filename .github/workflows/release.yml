name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build cyclonedx-bom
      - run: python -m build
      - run: pip install -e . && cyclonedx-py environment -o sbom.cdx.json --of JSON
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*
      - uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: dist/*.whl dist/*.tar.gz
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            sbom.cdx.json
