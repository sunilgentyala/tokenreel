name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        run: |
          V=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/tokenreel/__init__.py').read()).group(1))")
          test "v$V" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match package version v$V"; exit 1; }
      - run: pip install build cyclonedx-bom
      - run: python -m build
      - run: pip install -e . && cyclonedx-py environment -o sbom.cdx.json --of JSON
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*
      - uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: dist/*.whl dist/*.tar.gz
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*
            sbom.cdx.json
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sunilgentyala/tokenreel:${{ github.ref_name }}
            ghcr.io/sunilgentyala/tokenreel:latest
